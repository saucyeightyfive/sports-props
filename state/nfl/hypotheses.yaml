# HYPOTHESIS REGISTRY
# Every hypothesis opens as SHADOW (zero dollars). Tier changes are MANUAL and
# require user ratification. Claude proposes; the user decides.
#
# tier:      SHADOW | CONTESTED | PROVEN | RETIRED
# min_n:     prospective rows required before a tier change is even discussed
# record:    prospective only. mechanism observations live in mechanism.csv
#            and NEVER count toward this.

meta:
  season: 2026
  opened: null                      # set on first ratified framework
  active_count: 0
  framework_status: PROPOSED        # -> RATIFIED only by user
  last_revised: 2026-09-19
  revision_note: >
    Week 1 review. No hypothesis added -- the catalogue was sharpened, not
    grown. H1 gained a conversion floor and an honest conjunction flag, H5
    gained a second axis at no extra min_n cost, G3a proposed in rules.yaml.
    All four hypotheses still hold zero rows, which is the only reason these
    edits are legitimate: a definition may be revised freely before it has a
    record. Once the first row lands, the gate applies and the triggers
    freeze until min_n.
  proposed_on: 2026-09-12
  note: >
    Proposed 2026-09-12, mid-Week-1. Four of the five hypotheses below require
    current-season usage data that does not exist yet. The honest start date for
    H1/H2/H4 is Week 3 at the earliest; Weeks 1-2 are collection-only. H3 is the
    only one that can open immediately, because it tests market latency rather
    than usage history.

hypotheses:

  # -------------------------------------------------------------------------
  - id: H1
    name: Route-participation lag
    tier: SHADOW
    opened: null
    earliest_fire_week: 3
    mechanism: >
      Receiving prop lines are anchored to recent RESULT stats (yards, catches)
      and to name recognition. Route participation is the stable input and it
      moves BEFORE results do -- a player promoted into a full-time route role
      keeps a line priced off two weeks of low production in a smaller role.
      The market's error is anchoring on output while the input has already
      re-based. This is the cleanest available instance of G4.
    trigger:
      - route participation >= 78% in the most recent game
      - route participation rose >= 12 percentage points vs the player's prior
        3-game average
      - the receptions line has NOT moved up more than 0.5 vs the prior week
      - targets per route run >= 0.18 over the same window, and NOT trending
        down while route share rises (added 2026-09-19 -- a route-share read
        with no conversion floor is half a hypothesis)
    verify_underlying:
      - route participation (routes run / team dropbacks), last 3 games
      - target share and targets per route run (TPRR)
      - snap share, and whether the promotion has a durable cause (injury to a
        teammate, scheme change) or a one-week script artifact
      - team PROE -- a rising route share on a run-heavy team is worth less
    expression: player_receptions OVER
    conditions_required:
      - the player plays a normal snap count (not inactive, not a surprise
        rotation)
      - route participation holds at or near the observed level
      - targets convert at roughly his established TPRR
    conjunction: true
    conditions_named:
      opportunity: route participation holds at the observed level
      conversion: targets arrive at his established targets-per-route-run
    edge_claimed_on: opportunity
    conjunction_note: >
      Revised 2026-09-19 under G3a. This was logged as conjunction:false, which
      was wrong -- receptions needs both the routes AND the targets, and the
      two are separately priced and separately variable. The read claims edge
      on opportunity only; conversion is assumed, not predicted, and is graded
      as an assumption that held or failed. Receptions is still chosen over
      receiving yards deliberately: yards adds a THIRD condition (efficiency --
      aDOT, YAC, catch depth). Fewer conditions, not one.
    disproof: >
      Mean margin vs fair <= 0 over 40 rows, or mean CLV <= 0 over 25 rows.
      Also dies if TPRR turns out to fall as route share rises (i.e. the
      promotion is dilution, not opportunity) -- that would mean the mechanism
      is backwards, not merely weak.
    min_n: 40
    min_n_note: >
      Expected fire rate 3-6 rows/week from Week 3 => ~50-90 rows/season.
      Reachable. This is the hypothesis most likely to produce a real verdict.
    record:
      rows: 0
      wins: 0
      losses: 0
      pushes: 0
      mean_clv_cents: null
      mean_margin_vs_fair: null
    notes: []

  # -------------------------------------------------------------------------
  - id: H2
    name: Second-order target absorption
    tier: SHADOW
    opened: null
    earliest_fire_week: 3
    mechanism: >
      When a high-target player is ruled out, the market moves the obvious
      replacement at that position and stops. Vacated targets do not
      redistribute by depth chart -- they redistribute by alignment and route
      tree. The slot receiver and the TE frequently absorb more of a vacated
      outside WR's targets than the WR3 who "replaces" him does. The market
      prices the headline substitution and underprices the distribution.
    trigger:
      - a teammate with >= 20% target share (last 3 games) is ruled OUT or is
        CONFIRMED inactive
      - the candidate ran >= 55% of routes WITH that teammate active
      - the candidate's alignment overlaps the absent player's (slot/TE
        absorbing an outside WR, or the inverse), verified on route data --
        not assumed from the depth chart
    verify_underlying:
      - target share with and without the absent teammate (prior-season splits
        acceptable in the first weeks, tagged as such)
      - route participation and alignment split (slot rate / wide rate)
      - team pass attempts and PROE -- absorption of a share is worthless if
        total volume collapses
    expression: player_receptions OVER (primary), player_reception_yds OVER
      (secondary, logged in parallel per H5)
    conditions_required:
      - the absent teammate is genuinely out (CONFIRMED, not PROJECTED)
      - team pass volume holds near its baseline
      - the candidate absorbs share rather than a third player doing so
    conjunction: false
    disproof: >
      Mean margin vs fair <= 0 over 25 rows. Dies faster if the mechanism check
      fails independent of the bet: if measured absorbed target share does not
      exceed the candidate's baseline in a majority of fires, the read is
      wrong even where the props happen to cash. Track that in mechanism.csv.
    min_n: 25
    min_n_note: >
      Expected 1-2 rows/week => ~25-35 rows/season. Borderline. Likely to end
      the season with a directional read and no verdict. Accept that up front.
    record:
      rows: 0
      wins: 0
      losses: 0
      pushes: 0
      mean_clv_cents: null
      mean_margin_vs_fair: null
    notes: []

  # -------------------------------------------------------------------------
  - id: H3
    name: Friday-news latency (CLV-primary)
    tier: SHADOW
    opened: null
    earliest_fire_week: 1
    mechanism: >
      Prop markets for non-marquee players are thin, posted late, and repriced
      slowly after Friday practice reports and Saturday designations. Sides and
      totals absorb injury news within minutes; a WR3's receptions line can sit
      stale into Sunday morning. The error is not in the market's estimate --
      it is in the market's SPEED, on the least-attended boards. This is the
      one hypothesis that needs no current-season usage history, so it is the
      only one that can open now.
    trigger:
      - a role-relevant designation lands Fri/Sat (starter ruled OUT, or a
        candidate upgraded to full participation off an injury)
      - the affected player's prop is posted and has not moved >= 0.5 line or
        >= 10 cents within 4 hours of the news
      - the player's projected role is legible from prior usage or, in Weeks
        1-2 only, from preseason/camp role -- tagged PROJECTED
    verify_underlying:
      - timestamp of the news vs timestamp of the line
      - line and price across all four books -- a single stale book is a
        different (and weaker) claim than a stale market
      - the projected role itself (routes/snaps the player would inherit)
    expression: whichever prop the news most directly implicates, OVER or UNDER
      as the news dictates. Record the news timestamp in notes.
    conditions_required:
      - the news is accurate and the status holds to kickoff
      - the line is genuinely stale rather than correctly unmoved
    conjunction: false
    disproof: >
      Mean CLV <= 0 over 20 rows. This hypothesis is graded on CLV FIRST and
      W/L a distant second: if the line does not move toward the stake price by
      close, there was no latency to exploit and the read was imagined. A
      positive W/L with flat CLV here is GAMBLED, not CONFIRMED.
    min_n: 20
    min_n_note: >
      1-3 rows/week => ~30-50 rows/season. CLV stabilizes faster than margin,
      so 20 rows is a real (if early) read on this one specifically.
    record:
      rows: 0
      wins: 0
      losses: 0
      pushes: 0
      mean_clv_cents: null
      mean_margin_vs_fair: null
    notes:
      - "Requires paid Odds API historical endpoints or disciplined manual
        capture at two timestamps. Without a real close, this hypothesis cannot
        be graded at all -- do not open it on manual-only capture."

  # -------------------------------------------------------------------------
  - id: H5
    name: Expression-form control (meta)
    tier: SHADOW
    opened: null
    earliest_fire_week: 3
    mechanism: >
      Not a market read. A test of G3 itself. The claim is that for one
      underlying read, the single-condition expression (receptions, attempts)
      produces better mean margin vs fair and better CLV than the
      multi-condition expression (yards), because the yards line silently
      charges for an efficiency condition the read never claimed. If true,
      every future hypothesis should default to counting stats. If false, the
      repo's structural preference for props is weaker than assumed and G3
      needs amending.
    trigger:
      - any H1 or H2 row fires and both expressions are available on the board
    verify_underlying:
      - same underlying as the parent row; no additional verification needed
    axes:
      - name: form
        pair: counting stat (receptions, attempts) vs yardage on the same read
        claim: fewer conditions should produce better margin vs fair and CLV
      - name: anchor
        added: 2026-09-19
        pair: >
          volume-anchored read (team pass attempts, implied total, funnel
          matchup) vs share-anchored read (target share, targets per route run)
          on the same game
        claim: >
          Team pass volume is heavily bet and tied to the game total, so it is
          priced efficiently. Individual share is priced off reputation and
          season-long averages and moves slower. If that holds, the edge lives
          in share, and a volume-anchored read is buying something the market
          already knows. Week 1 is one data point consistent with this and
          nothing more -- it is why the axis exists, not evidence for it.
    expression: parallel shadow rows on the identical read, identical
      timestamp, sharing a pair_id
    conditions_required:
      - both boards available at stake-time
    conjunction: false
    disproof: >
      Per axis, independently. FORM: paired mean margin vs fair shows no
      advantage to the fewer-condition expression over 30 pairs, or the
      advantage reverses. ANCHOR: share-anchored reads show no advantage over
      volume-anchored ones across 30 pairs. Either axis can die alone.
    min_n: 30
    min_n_note: >
      Rides free on H1/H2 -- costs no additional judgment and no dollars, and
      doubles the row count from reads already being made. This is the cheapest
      sample in the repo and directly attacks the sample-starvation problem.
    record:
      rows: 0
      wins: 0
      losses: 0
      pushes: 0
      mean_clv_cents: null
      mean_margin_vs_fair: null
    notes:
      - "Pairs must share a pair_id in bets.csv notes for the comparison to be
        computable. Suggest adding a pair_id column."

# Written down, deliberately NOT opened. A candidate becomes a hypothesis only
# when there is a mechanism worth testing AND the sample exists to test it.
# Opening one costs a min_n the season may not afford, so the bar to promote is
# higher than the bar to write down.
candidates:
  - id: H6
    name: Share-blind volume pricing
    status: CANDIDATE -- not opened
    written: 2026-09-19
    mechanism: >
      Receiving lines move with the team's implied total and with the opposing
      defence's pass-funnel reputation, but not with the player's own target
      share trend. If true, a player whose share is declining inside a rising
      team total is systematically overpriced -- the line inherits the team's
      good news and ignores his bad news.
    why_not_opened: >
      Three reasons, any one sufficient. (1) It needs three or more weeks of
      current-season share data, so it could not fire before Week 5 anyway.
      (2) It overlaps H1 enough that the two would compete for the same rows,
      and with ~16 games a week the binding constraint is sample, not ideas --
      a fifth hypothesis makes all five slower to resolve. (3) It was suggested
      by one Sunday. One Sunday is not evidence of a market behaviour, and a
      catalogue that grows every time a bet loses is fitting noise with extra
      steps.
    revisit: Week 6, and only if H1 has produced rows showing conversion
      failures are systematic rather than incidental.

retired: []
